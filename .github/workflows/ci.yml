name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - name: Write synthetic action inputs
        run: node --input-type=module -e "import {writeFile} from 'node:fs/promises'; import {task, HEAD} from './eval/fixtures.js'; await writeFile('task.json', JSON.stringify(task)); await writeFile('evidence.json', JSON.stringify({version:1,headSha:HEAD,items:[]}));"
      - name: Verify native action fails closed on unsuccessful CI
        id: gate
        continue-on-error: true
        uses: ./
        with:
          task-file: task.json
          evidence-file: evidence.json
          head-sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          steps: '{"test":{"outcome":"failure","conclusion":"success"}}'
      - name: Assert denial and report
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          DECISION: ${{ steps.gate.outputs.decision }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: node -e "const assert = require('node:assert/strict'); const report = require('./rev-report.json'); assert.equal(process.env.OUTCOME, 'failure'); assert.equal(process.env.DECISION, 'deny'); assert.equal(process.env.REASON, 'ci-not-successful'); assert.equal(report.criteria.length, 2);"
