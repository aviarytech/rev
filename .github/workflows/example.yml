name: Try acceptance verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise the export example
        shell: bash
        run: |
          set -o pipefail
          node --test examples/export/route.test.js 2>&1 | tee example-tests.log
          node examples/export/observe.js example-observations.json
      - name: Collect explicit evidence for this commit
        env:
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/evidence.js "$HEAD_SHA" examples/export/sources.json evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: evidence.json
  rev:
    name: REV
    needs: [check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-evidence
      - name: Evaluate acceptance criteria
        id: rev
        if: ${{ !cancelled() }}
        uses: ./
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
          task-file: examples/export/task.json
          evidence-file: evidence.json
          head-sha: ${{ github.sha }}
          needs: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rev-report
          path: rev-report.json
          if-no-files-found: ignore
