name: Verify local Claude review
on:
  repository_dispatch:
    types: [rev-local-review]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress, completed]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write
concurrency:
  group: rev-local-review-verifier
  cancel-in-progress: false
jobs:
  verify:
    name: Verify signed review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out or execute a pull request revision in this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aviarytech/rev
          ref: 055b327f1d11a26966f244be7d263708ecd72502
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node scripts/local-review-gate.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REV_LOCAL_REVIEW_PUBLIC_KEY: ${{ vars.REV_LOCAL_REVIEW_PUBLIC_KEY }}
