name: Live acceptance eval
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare live model verdicts with labeled synthetic cases
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rev-eval-report
          path: rev-eval-report.json
          if-no-files-found: ignore
