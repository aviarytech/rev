name: REV
description: A fast approve/deny CI gate powered by TypeSafe AI's Jev.
author: REV
branding:
  icon: check-circle
  color: purple
inputs:
  api-key:
    description: TypeSafe API key. Alternatively set TYPESAFE_API_KEY.
    required: false
  policy:
    description: Optional replacement for REV's default review of completed operations.
    required: false
  steps:
    description: Earlier named steps in this job, supplied as toJSON(steps).
    default: '{}'
  needs:
    description: Dependency jobs, supplied as toJSON(needs).
    default: '{}'
  inputs:
    description: Workflow inputs, supplied as toJSON(inputs).
    default: '{}'
  prior-inputs:
    description: JSON object mapping earlier step IDs to their non-secret inputs.
    default: '{}'
  corpus-file:
    description: Optional UTF-8 text or JSON evidence file, such as captured tool output.
    required: false
  model:
    description: TypeSafe model ID or alias.
    default: jev-1.14.0
  min-probability:
    description: Minimum approve probability, from 0.5 to 1.
    default: '0.9'
  min-confidence:
    description: Minimum Choice confidence, from 0 to 1.
    default: '0.8'
  timeout-ms:
    description: API deadline in milliseconds, from 100 to 60000. No retries.
    default: '10000'
outputs:
  decision:
    description: approve or deny. Errors also produce deny.
  approved:
    description: 'true only when the gate approves; otherwise false.'
  probability:
    description: Jev's approve probability, or empty if not evaluated.
  confidence:
    description: Choice confidence, or empty if not evaluated.
  model:
    description: Actual model returned by TypeSafe, or empty if not evaluated.
  reason:
    description: Stable code explaining approval or denial.
  duration-ms:
    description: Total gate execution time in milliseconds.
runs:
  using: node24
  main: src/index.js
