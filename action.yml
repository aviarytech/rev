name: REV
description: Evaluate task acceptance criteria against commit-bound implementation evidence.
author: REV
branding:
  icon: check-circle
  color: purple
inputs:
  api-key:
    description: TypeSafe API key. Alternatively set TYPESAFE_API_KEY.
    required: false
  task-file:
    description: JSON task and acceptance criteria manifest (version 1).
    required: true
  evidence-file:
    description: JSON evidence manifest with headSha and named source items (version 1).
    required: true
  head-sha:
    description: Exact PR head commit expected in the evidence manifest. Not the synthetic merge SHA.
    required: true
  steps:
    description: Earlier named step results as toJSON(steps).
    default: '{}'
  needs:
    description: All applicable dependency job results as toJSON(needs).
    default: '{}'
  report-file:
    description: Where to write the machine-readable verdict report. Contains criterion text and source names, not evidence content.
    default: rev-report.json
  model:
    description: TypeSafe model ID. Changes require reevaluation.
    default: jev-1.14.0
  min-probability:
    description: Minimum probability for the verdict and each evidence relationship.
    default: '0.9'
  min-confidence:
    description: Minimum Choice confidence for the verdict and each evidence relationship.
    default: '0.8'
  timeout-ms:
    description: API deadline in milliseconds (100–60000). One request, no retries.
    default: '10000'
outputs:
  decision:
    description: approve or deny. Errors deny.
  approved:
    description: String true only when all criteria are verified and supplied CI results pass.
  reason:
    description: Stable decision or error code.
  head-sha:
    description: Commit evaluated. Empty if input validation failed.
  verified:
    description: Number of criteria judged satisfied with sufficient confidence and supporting implementation and behavioral references.
  total:
    description: Number of acceptance criteria in the validated task.
  report-file:
    description: Path to the JSON report.
  model:
    description: Actual model returned, or empty if no evaluation completed.
  duration-ms:
    description: Total execution time.
runs:
  using: node24
  main: src/index.js
